<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>豆包视频去水印 · 隐私政策</title>
<meta name="description" content="豆包视频去水印浏览器扩展隐私政策：不收集任何用户个人数据，所有解析均在本地完成。" />
<style>
  :root {
    --bg: #f5f7fb;
    --card: #ffffff;
    --ink: #1f2937;
    --muted: #6b7280;
    --line: #e6e9f0;
    --brand: #4f46e5;
    --brand2: #7c3aed;
    --ok: #059669;
    --ok-bg: #ecfdf5;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 28px rgba(16,24,40,.06);
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  header {
    position: sticky; top: 0; z-index: 20;
    backdrop-filter: saturate(160%) blur(12px);
    background: rgba(255,255,255,.82);
    border-bottom: 1px solid var(--line);
  }
  .nav {
    max-width: 880px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 22px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
  .brand .logo {
    width: 30px; height: 30px; border-radius: 9px;
    background: linear-gradient(135deg, var(--brand), var(--brand2));
    display: grid; place-items: center; color: #fff; font-size: 16px;
    box-shadow: 0 4px 12px rgba(79,70,229,.35);
  }
  .toggle {
    display: inline-flex; background: #eef0f6; border-radius: 999px; padding: 4px; gap: 2px;
  }
  .toggle button {
    border: 0; background: transparent; cursor: pointer;
    font: inherit; font-size: 13px; font-weight: 600; color: var(--muted);
    padding: 6px 14px; border-radius: 999px; transition: .2s;
  }
  .toggle button.active { background: #fff; color: var(--brand); box-shadow: var(--shadow); }

  /* Layout */
  main { max-width: 880px; margin: 0 auto; padding: 0 22px 64px; }

  /* Hero */
  .hero {
    margin: 36px 0 28px; padding: 40px 36px;
    border-radius: 24px; color: #fff; position: relative; overflow: hidden;
    background: radial-gradient(120% 140% at 0% 0%, #6366f1 0%, #4f46e5 45%, #4338ca 100%);
    box-shadow: 0 18px 40px rgba(67,56,202,.30);
  }
  .hero::after {
    content: ""; position: absolute; right: -60px; top: -60px;
    width: 240px; height: 240px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.22), transparent 70%);
  }
  .hero h1 { margin: 0 0 10px; font-size: 28px; letter-spacing: .5px; }
  .hero p { margin: 0; opacity: .92; font-size: 15px; max-width: 560px; }
  .hero .meta { margin-top: 18px; font-size: 13px; opacity: .85; display: inline-flex; gap: 8px; align-items: center;
    background: rgba(255,255,255,.15); padding: 6px 14px; border-radius: 999px; }

  /* No-data banner */
  .banner {
    display: flex; gap: 16px; align-items: flex-start;
    background: var(--ok-bg); border: 1px solid #bbf7d0; color: #065f46;
    border-radius: var(--radius); padding: 20px 22px; margin-bottom: 26px;
  }
  .banner .ic {
    flex: none; width: 38px; height: 38px; border-radius: 11px; background: #fff; color: var(--ok);
    display: grid; place-items: center; box-shadow: var(--shadow);
  }
  .banner h3 { margin: 2px 0 4px; font-size: 16px; color: #047857; }
  .banner p { margin: 0; font-size: 14px; }

  /* Sections */
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 26px 28px; margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  .card .head { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .num {
    flex: none; width: 30px; height: 30px; border-radius: 9px; color: #fff; font-weight: 700; font-size: 14px;
    display: grid; place-items: center; background: linear-gradient(135deg, var(--brand), var(--brand2));
  }
  .card h2 { margin: 0; font-size: 18px; }
  .card p { margin: 0 0 12px; color: #374151; font-size: 15px; }
  .card p:last-child { margin-bottom: 0; }
  .card ul { margin: 6px 0 12px; padding-left: 4px; list-style: none; }
  .card ul li { position: relative; padding-left: 22px; margin-bottom: 12px; color: #374151; font-size: 15px; }
  .card ul li::before {
    content: ""; position: absolute; left: 4px; top: 9px; width: 8px; height: 8px; border-radius: 50%;
    background: linear-gradient(135deg, var(--brand), var(--brand2));
  }
  .card ul li b { color: var(--ink); }
  .card ul li:last-child { margin-bottom: 0; }

  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 30px 22px 10px; }
  footer a, .card a { color: var(--brand); text-decoration: none; border-bottom: 1px solid rgba(79,70,229,.28); }

  @media (max-width: 600px) {
    .hero { padding: 30px 22px; }
    .hero h1 { font-size: 23px; }
    .card { padding: 22px 18px; }
  }
</style>
</head>
<body data-lang="zh">
  <header>

    sections: [

  en: {
    brand: "Doubao Video Watermark Remover",

    lastUpdated: "Last updated: July 15, 2026",
    noDataTitle: "Zero data collection",
    noDataDesc: "This extension runs entirely locally in your browser and never sends your personal or browsing data to any remote server.",
    footer: "This Privacy Policy is published by the “Doubao Video Watermark Remover” extension and is updated together with new versions.",
    sections: [
      { n: "01", title: "1. Overview",
        html: `<p>The “Doubao Video Watermark Remover” (the “Extension”) is a browser extension that provides watermark-free video and original-image parsing/extraction for the Doubao web platform. Its sole purpose is to let users one-click parse media on Doubao conversation and share pages and export watermark-free videos and images, solely for saving their own lawfully generated Doubao materials.</p>

      { n: "02", title: "2. Information we collect",
        html: `<p><b>We do not collect any of your personal data.</b> The Extension does not collect, store, or upload any personal or browsing data. Specifically, we do not collect any of the following categories:</p>

          <li><b>Financial and payment information</b>;</li>
          <li><b>Authentication information</b> — passwords, credentials, security questions, etc.;</li>
          <li><b>Personal communications</b> — email, SMS, chat messages, etc.;</li>
          <li><b>Location information</b>;</li>
          <li><b>Web browsing history</b>;</li>

        <p>All parsing is performed locally in your browser, and media files are downloaded directly to your device by the browser — they never pass through any remote server.</p>` },
      { n: "03", title: "3. Permission justification",
        html: `<p>Every permission requested by the Extension serves only its core function — “media parsing, local download, quick link copy, and right-click shortcuts” — with no behavior unrelated to material extraction:</p>

          <li><b>activeTab / tabs</b>: Only when you actively click the extension icon do we temporarily access the current tab to read video/image resource URLs on Doubao pages. Only the active tab is accessed; other pages are never read automatically, and there is no background silent collection.</li>

function render(lang) {
  const d = I18N[lang];
  document.body.dataset.lang = lang;
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.title = d.brand + ' · ' + (lang === 'zh' ? '隐私政策' : 'Privacy Policy');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (d[k] != null) el.textContent = d[k];
  });
  const wrap = document.getElementById('sections');
  wrap.innerHTML = d.sections.map(s => `
    <section class="card">
      <div class="head"><span class="num">${s.n}</span><h2>${s.title}</h2></div>
      ${s.html}
    </section>`).join('');
  document.querySelectorAll('[data-lang-btn]').forEach(b => {
    b.classList.toggle('active', b.getAttribute('data-lang-btn') === lang);
  });
}

document.querySelectorAll('[data-lang-btn]').forEach(b => {
  b.addEventListener('click', () => {
    const lang = b.getAttribute('data-lang-btn');
    localStorage.setItem('pp-lang', lang);
    render(lang);
  });
});

const saved = localStorage.getItem('pp-lang') || 'zh';
render(saved);
</script>
</body>
